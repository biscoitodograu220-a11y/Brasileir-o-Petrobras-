<title>Brasileirão Petrobras Alex</title>
<style>
  html,body{margin:0;height:100%;background:#1b2a34;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  @supports(height:100dvh){html,body{height:100dvh}}
  canvas{width:min(100vw,calc(100vh*960/620));width:min(100vw,calc(100dvh*960/620));height:auto;border-radius:8px;box-shadow:0 10px 40px #000a;display:block;touch-action:none}
  :root{--k:clamp(72px,24vh,100px);--b:clamp(54px,17vh,72px);--j:clamp(104px,32vh,150px);--g:14px;--f:clamp(9px,2.7vh,13px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-bottom,0px)}
  #touch{position:fixed;inset:0;display:none;pointer-events:none;z-index:5}
  #touch.on{display:block}
  #touch>*{position:absolute;pointer-events:auto;touch-action:none;box-sizing:border-box;border-radius:50%;border:3px solid rgba(255,255,255,.5);background:rgba(20,30,40,.5)}
  #touch>.tb{display:flex;align-items:center;justify-content:center;font:700 var(--f) system-ui,sans-serif;color:#fff;text-align:center}
  #touch>.tb.act{background:rgba(255,210,63,.65);color:#16212b}
  #joy{left:calc(var(--g)*2 + var(--sl));bottom:calc(var(--g)*2 + var(--sb));width:var(--j);height:var(--j)}
  #knob{position:absolute;left:50%;top:50%;width:42%;height:42%;border-radius:50%;background:rgba(255,255,255,.65);transform:translate(-50%,-50%);pointer-events:none}
  #kick{width:var(--k);height:var(--k);right:calc(var(--g) + var(--sr));bottom:calc(var(--g) + var(--sb))}
  #slide{width:var(--b);height:var(--b);right:calc(var(--g)*2 + var(--k) + var(--sr));bottom:calc(var(--g) + var(--sb))}
  #run{width:var(--b);height:var(--b);right:calc(var(--g) + (var(--k) - var(--b))/2 + var(--sr));bottom:calc(var(--g)*2 + var(--k) + var(--sb))}
  #swap{width:calc(var(--b)*.75);height:calc(var(--b)*.75);right:calc(var(--g)*2 + var(--k) + var(--sr));bottom:calc(var(--g)*2 + var(--b) + var(--sb))}
  #pausebtn{width:40px;height:40px;right:calc(var(--g) + var(--sr));top:var(--g)}
  #rotate{display:none;position:fixed;inset:0;z-index:10;background:rgba(15,20,30,.96);color:#ffd23f;font:700 22px system-ui,sans-serif;text-align:center;align-items:center;justify-content:center;padding:24px}
  @media (orientation:portrait){body.mobile #rotate{display:flex}}
  #code{display:none;position:fixed;z-index:6;text-align:center;text-transform:uppercase;font:700 30px system-ui,sans-serif;letter-spacing:.2em;border-radius:12px;border:3px solid #ffd23f;background:#16212b;color:#fff;outline:none;box-sizing:border-box;padding:0;-webkit-user-select:text;user-select:text}
</style>
</head>

// ---------- Ações ----------

// ---------- Controle humano ----------
function pickCtrl(c, force) {
  let best = null, bd = 1e9;
  for (const p of players) {
    if (p.team !== c.team || p.role === 'gk') continue;
    const d = dist(p, ball); if (d < bd) { bd = d; best = p; }
  }
  // troca MANUAL: só ao apertar TROCAR e sem estar com a bola (com a bola o botão vira DRIBLE) · vai pro mais perto da bola

        movePlayer(p, ball.x + ball.vx * lead - p.x, ball.y + ball.vy * lead - p.y, true, dt, scale);
      } else approachBall(p, goalX, CY, dt, scale);

      if (dd <= 8) p.ang = Math.atan2(ball.y - p.y, ball.x - p.x);
    }

  }

  if (chasers[p.team] === p) {
    if (hasBall) {
      const dg = Math.abs(goalX - p.x);

        if (inArea(p)) {
          if (Math.random() < 6 * dt) shootAt(p, rnd(500, 650));
        } else {
          p.poss += dt;
          const squeezed = players.some(o => o.team !== p.team && o.role !== 'gk' && dist(o, p) < 62);
          if (p.poss > 0.45 || squeezed) { const tg = findPassTarget(p); if (tg) doPass(p, tg); }

      } else approachBall(p, goalX, aimY, dt, scale);

    movePlayer(p, dd > 8 ? dx : 0, dd > 8 ? dy : 0, dd > 140, dt, scale * (dd < 30 ? 0.6 : 1));

  }
}

// ---------- Penaltis ----------
function startShootout() {
  state = 'pen';

          ai: {}, goalFlag: false, saved: false, shotT: 0, res: '', diveT: 0, diveDir: 0, diveUsed: false, kTarget: CY, kDelay: 0.08 };
  passInfo = null; foulInfo = null; parts = [];

  for (const c of ctrls) c.charge = 0;

}
function penSetup() {
  const t = pen.turn, d = t ? -1 : 1, goalX = t ? PL : PR, own = 1 - t;
  const keeper = players.find(p => p.team === own && p.role === 'gk');
  const pool = players.filter(p => p.team === t && p.role !== 'gk');
  const shooter = pool[pen.kicks[t].length % pool.length];
  players.filter(p => p !== keeper && p !== shooter).forEach((p, i) => {
    p.vx = p.vy = 0; p.slide = 0; p.stun = 0; p.hold = 0;
    if (p.role === 'gk') { const h = homePos(p, true); p.x = h.x; p.y = h.y; }
    else { p.x = CX + (p.team ? 1 : -1) * (70 + Math.floor(i / 5) * 24); p.y = CY - 60 + (i % 5) * 30; }
  });
  ball.x = goalX - d * 85; ball.y = CY; ball.vx = ball.vy = 0;
  shooter.x = ball.x - d * 26; shooter.y = CY; shooter.vx = shooter.vy = 0; shooter.ang = d > 0 ? 0 : Math.PI;
  shooter.kickCd = 0; shooter.stun = 0; shooter.slide = 0; shooter.hold = 0;
  keeper.x = goalX - d * 26; keeper.y = CY; keeper.vx = keeper.vy = 0; keeper.stun = 0; keeper.hold = 0;
  Object.assign(pen, { phase: 'aim', t: 0, shooter, keeper, aim: 0, charge: 0, goalFlag: false, saved: false, shotT: 0, diveT: 0, diveDir: 0, diveUsed: false,
    ai: { delay: rnd(1.0, 1.7), aim: (Math.random() < 0.5 ? -1 : 1) * rnd(28, GH - 8), pow: rnd(0.45, 1) } });
  for (const c of ctrls) { c.p = c.team === t ? shooter : keeper; c.charge = 0; }
  beep(700, 0.08, 'sine', 0.06);
}
function penFire(ai) {
  const sh = pen.shooter, goalX = pen.turn ? PL : PR;
  const err = rnd(-1, 1) * (ai ? 8 : (pen.charge > 0.88 ? 24 : 6));
  const ty = CY + pen.aim + err;
  if (!kick(sh, Math.atan2(ty - ball.y, goalX - ball.x), 420 + 360 * pen.charge)) return;
  pen.phase = 'shot'; pen.shotT = 0; pen.goalFlag = false; pen.saved = false;

  pen.kDelay = 0.08;
}
function penResolve(r) {
  pen.kicks[pen.turn].push(r === 'G'); pen.phase = 'result'; pen.t = 0; pen.res = r;
  if (r === 'G') [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.22, 'triangle', 0.1), i * 120));

}
function penWinner() {
  const k = pen.kicks, a = k[0].length, b = k[1].length, s0 = k[0].filter(Boolean).length, s1 = k[1].filter(Boolean).length;
  if (a <= 5 && b <= 5) {
    if (s0 > s1 + (5 - b)) return 0;
    if (s1 > s0 + (5 - a)) return 1;
    if (a === 5 && b === 5 && s0 !== s1) return s0 > s1 ? 0 : 1;
    return null;
  }
  if (a === b && s0 !== s1) return s0 > s1 ? 0 : 1;

}
function updatePen(dt) {
  pen.t += dt;
  if (pen.phase === 'intro') { if (pen.t > 2.4) penSetup(); return; }
  const t = pen.turn, sh = pen.shooter, kp = pen.keeper;
  const cs = ctrls.find(c => c.p === sh), ck = ctrls.find(c => c.p === kp);

      pen.aim = clamp(pen.aim, -(GH + 18), GH + 18);
      if (isDown(cs, 'kick')) pen.charge = Math.min(1, pen.charge + dt * 1.2);
      cs.charge = pen.charge;

  }

    } else if (pen.phase === 'shot' && pen.shotT > pen.kDelay) kp.vy = clamp((pen.kTarget - kp.y) * 10, -360, 360);

// ---------- Fisica ----------
function physics(dt) {
  for (const p of players) {
    p.kickCd -= dt; p.slideCd -= dt; p.dribCd -= dt; if (p.hold > 0) p.hold -= dt;
    if (p.drib > 0) { p.drib -= dt; const dk = Math.exp(-3 * dt); p.vx *= dk; p.vy *= dk; }
    if (p.stun > 0) { p.stun -= dt; const k = Math.exp(-6 * dt); p.vx *= k; p.vy *= k; }
    if (p.slide > 0) {
      p.slide -= dt; const k = Math.exp(-2.4 * dt); p.vx *= k; p.vy *= k;
      if (Math.random() < 30 * dt) dust(p.x, p.y, 1, 40);
      if (!p.slideHit && state === 'play') {
        for (const o of players) {
          if (o.team === p.team || o.role === 'gk' || o.stun > 0 || o.slide > 0) continue;
          if (dist(o, p) < PRAD * 2 + 6) {
            if (o.drib > 0) { p.stun = 0.9; p.slide = 0; p.vx *= 0.3; p.vy *= 0.3; p.slideHit = true; dust(o.x, o.y, 8, 90); beep(660, 0.1, 'triangle', 0.08); break; }   // DRIBLE = counter
            o.stun = 1.0; o.vx = p.vx * 0.6; o.vy = p.vy * 0.6; p.slideHit = true;
            if (dist(o, ball) < 34) { ball.vx = Math.cos(p.ang) * 320 + rnd(-60, 60); ball.vy = Math.sin(p.ang) * 320 + rnd(-60, 60); }
            dust(o.x, o.y, 10, 120); beep(90, 0.15, 'square', 0.07);
            if (Math.random() < 0.25) callFoul(p, o);   // 25% das rasteiras que acertam viram falta
            break;
          }
        }
      }
    }
    p.x += p.vx * dt; p.y += p.vy * dt;
    const sp = Math.hypot(p.vx, p.vy);
    p.stride += sp * dt * 0.07;
    if (sp > 170 && Math.random() < 8 * dt) dust(p.x, p.y + 8, 1, 30);
    if (p.role === 'gk') {
      const d = p.team ? -1 : 1, gx = p.team ? PR : PL;
      const a = gx + d * 8, b = gx + d * 150;
      p.x = clamp(p.x, Math.min(a, b), Math.max(a, b)); p.y = clamp(p.y, CY - 135, CY + 135);
    } else {
      p.x = clamp(p.x, PL + PRAD, PR - PRAD); p.y = clamp(p.y, PT + PRAD, PB - PRAD);
    }
  }
  for (let i = 0; i < players.length; i++) for (let j = i + 1; j < players.length; j++) {
    const a = players[i], b = players[j];
    if (a.slide > 0 || b.slide > 0) continue;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
    if (d < PRAD * 2 && d > 0.01) { const push = (PRAD * 2 - d) / 2, nx = dx / d, ny = dy / d; a.x -= nx * push; a.y -= ny * push; b.x += nx * push; b.y += ny * push; }
  }
  // bola
  ball.x += ball.vx * dt; ball.y += ball.vy * dt;
  const f = Math.exp(-1.05 * dt); ball.vx *= f; ball.vy *= f;
  let sp = Math.hypot(ball.vx, ball.vy);
  if (sp > 780) { ball.vx *= 780 / sp; ball.vy *= 780 / sp; sp = 780; }
  if (sp < 6) { ball.vx = ball.vy = 0; sp = 0; }
  ball.roll += sp * dt / BR;
  for (const p of players) {
    if (p.stun > 0) continue;
    const dx = ball.x - p.x, dy = ball.y - p.y, d = Math.hypot(dx, dy), rr = PRAD + BR + (p.slide > 0 ? 4 : 0);
    if (d < rr && d > 0.001) {
      const nx = dx / d, ny = dy / d;
      ball.x = p.x + nx * rr; ball.y = p.y + ny * rr;
      if (p.slide > 0 && !players.some(o => o.drib > 0 && o.team !== p.team && dist(o, ball) < 30)) {
        const s = Math.hypot(p.vx, p.vy) || 1; ball.vx = p.vx / s * 380; ball.vy = p.vy / s * 380;
      } else {
        const rel = (ball.vx - p.vx) * nx + (ball.vy - p.vy) * ny;
        if (rel < 0) { ball.vx -= 1.2 * rel * nx; ball.vy -= 1.2 * rel * ny; }
        ball.vx += p.vx * 0.05; ball.vy += p.vy * 0.05;
      }
      if (state === 'pen' && pen && pen.phase === 'shot' && p === pen.keeper) pen.saved = true;
      // bola prensada contra a parede: escapa pelo lado (evita bola "travada")
      const mouth = Math.abs(ball.y - CY) < GH;
      const loX = mouth ? PL - GD + BR : PL + BR, hiX = mouth ? PR + GD - BR : PR - BR;
      if (ball.x <= loX + 0.5 || ball.x >= hiX - 0.5) {
        const s = Math.abs(ball.y - p.y) > 3 ? Math.sign(ball.y - p.y) : (ball.y < CY ? 1 : -1);
        ball.vy = s * Math.max(Math.abs(ball.vy), 180);
      }
      if (ball.y <= PT + BR + 0.5 || ball.y >= PB - BR - 0.5) {
        const s = Math.abs(ball.x - p.x) > 3 ? Math.sign(ball.x - p.x) : (ball.x < CX ? 1 : -1);
        ball.vx = s * Math.max(Math.abs(ball.vx), 180);
      }
    }
  }
  for (const [px, py] of POSTS) {
    const dx = ball.x - px, dy = ball.y - py, d = Math.hypot(dx, dy);
    if (d < BR + 5 && d > 0.001) {
      const nx = dx / d, ny = dy / d;
      ball.x = px + nx * (BR + 5); ball.y = py + ny * (BR + 5);
      const vn = ball.vx * nx + ball.vy * ny;
      if (vn < 0) { ball.vx -= 1.7 * vn * nx; ball.vy -= 1.7 * vn * ny; beep(900, 0.06, 'sine', 0.06); }
    }
  }
  if (ball.y < PT + BR) { ball.y = PT + BR; ball.vy = Math.abs(ball.vy) * 0.6; }
  if (ball.y > PB - BR) { ball.y = PB - BR; ball.vy = -Math.abs(ball.vy) * 0.6; }
  const inMouth = Math.abs(ball.y - CY) < GH;
  if (ball.x < PL + BR && !inMouth) { ball.x = PL + BR; ball.vx = Math.abs(ball.vx) * 0.6; }
  if (ball.x > PR - BR && !inMouth) { ball.x = PR - BR; ball.vx = -Math.abs(ball.vx) * 0.6; }
  if (ball.x < PL - GD + BR) { ball.x = PL - GD + BR; ball.vx = Math.abs(ball.vx) * 0.25; }
  if (ball.x > PR + GD - BR) { ball.x = PR + GD - BR; ball.vx = -Math.abs(ball.vx) * 0.25; }
  if (ball.x < PL - 2 || ball.x > PR + 2) {
    if (ball.y < CY - GH + BR) { ball.y = CY - GH + BR; ball.vy = Math.abs(ball.vy) * 0.3; }
    if (ball.y > CY + GH - BR) { ball.y = CY + GH - BR; ball.vy = -Math.abs(ball.vy) * 0.3; }
  }
  if (state === 'play') {
    if (ball.x < PL - 6) goal(1); else if (ball.x > PR + 6) goal(0);
  } else if (state === 'pen' && pen && pen.phase === 'shot' && !pen.saved && !pen.goalFlag) {
    if (ball.x < PL - 6 || ball.x > PR + 6) pen.goalFlag = true;
  }
  for (const q of parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= Math.exp(-2 * dt); q.vy *= Math.exp(-2 * dt); q.l -= dt; }
  parts = parts.filter(q => q.l > 0);
}
